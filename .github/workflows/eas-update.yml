name: EAS Update (OTA)

on:
  push:
    branches:
      - main
    paths:
      - "interp-practice/**"
      - "!interp-practice/**.md"

jobs:
  update:
    name: OTA Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interp-practice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interp-practice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        run: npx eas-cli update --channel preview --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
